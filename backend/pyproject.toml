[project]
name = "backend"
version = "0.1.0"
description = "Agentic RAG backend"
readme = "README.md"
authors = [
    { name = "Chinmaye HG", email = "chinmaye115@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "groq>=1.7.0",
    "langgraph>=0.2.0",
    "litellm>=1.102.1",
    "numpy>=2.0.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
